name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out Audímetro
        uses: actions/checkout@v7
        with:
          path: audimetro

      - name: Check out radar-core
        uses: actions/checkout@v7
        with:
          repository: Arreketefo/radar-core
          ref: v0.1.0
          path: radar-core

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "audimetro/uv.lock"

      - name: Install locked dependencies
        working-directory: audimetro
        run: make vendor-core && uv sync --locked --dev

      - name: Run tests
        working-directory: audimetro
        run: uv run pytest -q

      - name: Run Ruff
        working-directory: audimetro
        run: uv run ruff check .

      - name: Run mypy
        working-directory: audimetro
        run: uv run mypy audimetro

      - name: Build distributions
        working-directory: audimetro
        run: uv build
