[project]
name = "audimetro"
version = "0.1.0"
description = "Multi-platform audience analytics with daily deltas and Telegram reports"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oscar Aguilar Ramos" }]
requires-python = ">=3.12"
keywords = [
    "analytics",
    "asyncio",
    "instagram",
    "tiktok",
    "youtube",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "radar-core",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
]

[project.urls]
Homepage = "https://github.com/Arreketefo/audimetro"
Repository = "https://github.com/Arreketefo/audimetro"
Issues = "https://github.com/Arreketefo/audimetro/issues"
Changelog = "https://github.com/Arreketefo/audimetro/blob/main/CHANGELOG.md"

[project.scripts]
audimetro = "audimetro.cli:main"

[tool.uv.sources]
radar-core = { path = "vendor/radar-core" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audimetro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
